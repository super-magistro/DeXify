name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-deb:
    name: Build Debian Package & Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Version from Git Tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "Setting package version to $VER"
            sed -i "s/version = \".*\"/version = \"$VER\"/" pyproject.toml
            sed -i "s/version=\".*\"/version=\"$VER\"/" setup.py
            sed -i "s/VERSION=\".*\"/VERSION=\"$VER\"/" build_deb.sh
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install customtkinter pillow

      - name: Build Debian (.deb) Package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Build Python Package (sdist & wheel)
        run: |
          python -m build

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite: true
          files: |
            *.deb
            dist/*.whl
            dist/*.tar.gz

      - name: Publish package to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          skip-existing: true

  build-macos:
    name: Build macOS App Bundle (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install customtkinter pillow

      - name: Generate .icns Icon & Build macOS App Bundle (.dmg)
        run: |
          # Generate the base PNG icon
          python -c "import dextop; dextop.ensure_app_icon()" || true
          ICON_PNG="$HOME/.config/dextop/icon.png"

          # Convert PNG → .icns using macOS native tools (sips + iconutil)
          mkdir -p dextop.iconset
          for SIZE in 16 32 64 128 256 512; do
            sips -z $SIZE $SIZE "$ICON_PNG" --out "dextop.iconset/icon_${SIZE}x${SIZE}.png" > /dev/null
          done
          iconutil -c icns dextop.iconset -o dextop.icns

          # Build the .app bundle with the native .icns icon
          python -m PyInstaller --noconfirm --onedir --windowed --icon dextop.icns --name "dextop-mode" dextop.py

          # Package into a .dmg disk image
          hdiutil create -volname "DeXtop Mode" -srcfolder "dist/dextop-mode.app" -ov -format UDZO "dist/dextop-mode_macOS.dmg"

      - name: Upload macOS DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite: true
          files: |
            dist/dextop-mode_macOS.dmg

  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install customtkinter pillow

      - name: Generate .ico Icon & Build Windows Executable
        run: |
          # Generate the base PNG icon and convert to .ico using Pillow
          python -c "
import os, sys
sys.path.insert(0, '.')
import dextop
dextop.ensure_app_icon()
icon_png = os.path.expanduser('~/.config/dextop/icon.png')
from PIL import Image
img = Image.open(icon_png).convert('RGBA')
img.save('icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
print('icon.ico generated successfully')
"
          # Build the standalone .exe with the native .ico icon
          python -m PyInstaller --noconfirm --onefile --windowed --icon icon.ico --name "dextop-mode_windows_x64" dextop.py

      - name: Upload Windows Executable to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite: true
          files: |
            dist/dextop-mode_windows_x64.exe
