name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-deb:
    name: Build Debian Package & Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install customtkinter pillow

      - name: Build Debian (.deb) Package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Build Python Package (sdist & wheel)
        run: |
          python -m build

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite: true
          files: |
            *.deb
            dist/*.whl
            dist/*.tar.gz

      - name: Publish package to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          skip-existing: true

  build-macos:
    name: Build macOS App Bundle (.zip)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install customtkinter pillow

      - name: Generate Icon & Build macOS App Bundle (.dmg)
        run: |
          python -c "import dextop; dextop.ensure_app_icon()" || true
          python -m PyInstaller --noconfirm --onedir --windowed --name "dextop-mode" dextop.py
          hdiutil create -volname "DeXtop Mode" -srcfolder "dist/dextop-mode.app" -ov -format UDZO "dist/dextop-mode_macOS.dmg"

      - name: Upload macOS DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite: true
          files: |
            dist/dextop-mode_macOS.dmg
